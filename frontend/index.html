<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f1" />
    <script>
      try {
        const theme = localStorage.getItem("wordwell-theme");
        document.documentElement.dataset.theme =
          theme === "dark" || theme === "purple" ? theme : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <title>Wordwell — английский в твоём ритме</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
