server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/words {
        proxy_pass http://vocabulary:8000/words;
    }
    location /api/practice {
        proxy_pass http://practice:8000/practice;
    }
    location /api/insights {
        proxy_pass http://insights:8000/insights;
    }
    location / {
        try_files $uri /index.html;
    }
}
