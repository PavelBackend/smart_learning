server {
    listen 80;
    server_name _;
    client_max_body_size 21m;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/words {
        set $vocabulary_backend vocabulary:8000;
        rewrite ^/api/words(.*)$ /words$1 break;
        proxy_pass http://$vocabulary_backend;
    }
    location /api/practice {
        set $practice_backend practice:8000;
        rewrite ^/api/practice(.*)$ /practice$1 break;
        proxy_pass http://$practice_backend;
    }
    location /api/insights {
        set $insights_backend insights:8000;
        rewrite ^/api/insights(.*)$ /insights$1 break;
        proxy_pass http://$insights_backend;
    }
    location / {
        try_files $uri /index.html;
    }
}
