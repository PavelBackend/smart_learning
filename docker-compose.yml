services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learning_local}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learning} -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-learning}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-learning_local}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

  vocabulary:
    build:
      context: .
      dockerfile: services/vocabulary/Dockerfile
    ports:
      - "127.0.0.1:${VOCABULARY_PORT:-8001}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-learning}:${POSTGRES_PASSWORD:-learning_local}@postgres:5432/vocabulary
      POSTGRES_ADMIN_URL: postgresql+psycopg://${POSTGRES_USER:-learning}:${POSTGRES_PASSWORD:-learning_local}@postgres:5432/postgres
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 15

  practice:
    build:
      context: .
      dockerfile: services/practice/Dockerfile
    ports:
      - "127.0.0.1:${PRACTICE_PORT:-8002}:8000"
    environment: &practice_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-learning}:${POSTGRES_PASSWORD:-learning_local}@postgres:5432/practice
      VOCABULARY_URL: http://vocabulary:8000
    depends_on:
      postgres: {condition: service_healthy}
      vocabulary: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 15

  practice-publisher:
    build:
      context: .
      dockerfile: services/practice/Dockerfile
    command: ["python", "-m", "services.practice.src.workers.publisher"]
    environment:
      <<: *practice_env
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-learning}:${RABBITMQ_PASSWORD:-learning_local}@rabbitmq:5672/%2F
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      practice: {condition: service_healthy}
    restart: unless-stopped

  insights:
    build:
      context: .
      dockerfile: services/insights/Dockerfile
    ports:
      - "127.0.0.1:${INSIGHTS_PORT:-8003}:8000"
    environment: &insights_env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-learning}:${POSTGRES_PASSWORD:-learning_local}@postgres:5432/insights
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 15

  insights-worker:
    build:
      context: .
      dockerfile: services/insights/Dockerfile
    command: ["python", "-m", "services.insights.src.workers.consumer"]
    environment:
      <<: *insights_env
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-learning}:${RABBITMQ_PASSWORD:-learning_local}@rabbitmq:5672/%2F
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      insights: {condition: service_healthy}
    restart: unless-stopped

  journal:
    build:
      context: .
      dockerfile: services/journal/Dockerfile
    ports:
      - "127.0.0.1:${JOURNAL_PORT:-8004}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-learning}:${POSTGRES_PASSWORD:-learning_local}@postgres:5432/journal
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 15

  pronunciation:
    build:
      context: .
      dockerfile: services/pronunciation/Dockerfile
    volumes:
      - ./data/pronunciation:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 15

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      vocabulary: {condition: service_healthy}
      practice: {condition: service_healthy}
      insights: {condition: service_healthy}
      journal: {condition: service_healthy}
      pronunciation: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
